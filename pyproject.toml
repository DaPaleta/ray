[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-investigator"
version = "0.1.0"
description = "Ray — an email-threat investigator agent"
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt, which is what the brief asks a
# reader to install. This table stays empty on purpose, so the two never disagree.
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
